<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Sander United Arena</title>
  <meta name="description" content="Sander United Arena — combate de Sander contra Némesis na Estação Paulista.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="Sander United Arena"></canvas>

    <section id="intro" class="screen">
      <div class="intro-aura"></div>
      <div class="intro-card">
        <div class="eyebrow">ARENA ORIGINAL • ESTÁGIO 1/3</div>
        <h1>SANDERVERSE</h1>
        <p>SANDER UNITED ARENA</p>
        <div class="intro-hero">⚡</div>
        <button id="startBtn">ENTRAR NA ARENA</button>
      </div>
    </section>

    <section id="difficulty" class="screen hidden">
      <div class="panel">
        <div class="eyebrow">ESCOLHA A DIFICULDADE</div>
        <h2>Preparar confronto</h2>
        <div class="difficulty-grid">
          <button data-difficulty="easy"><b>BÁSICO</b><span>Némesis equilibrado</span></button>
          <button data-difficulty="normal"><b>MÉDIO</b><span>Experiência recomendada</span></button>
          <button data-difficulty="hard"><b>DIFÍCIL</b><span>IA agressiva + mais resistência</span></button>
        </div>
        <p class="tip">3 minutos • sem pontuação • vença reduzindo a energia do Némesis a zero.</p>
      </div>
    </section>

    <section id="hud" class="hidden">
      <div class="topbar">
        <button id="pauseBtn" class="mini">Ⅱ</button>
        <div class="stage">STAGE <b>1/3</b></div>
        <div class="meter-block"><span>❤️</span><div class="meter"><i id="sanderHp"></i></div></div>
        <div id="timer">03:00</div>
        <div class="meter-block energy"><span>⚡</span><div class="meter"><i id="sanderEnergy"></i></div></div>
        <div class="meter-block enemy"><span>☠</span><div class="meter"><i id="nemesisHp"></i></div></div>
        <button id="soundBtn" class="mini">🔊</button>
      </div>
      <div id="teleportStatus">TELEPORTE: PRONTO</div>
      <div id="message"></div>
    </section>

    <section id="touch" class="hidden">
      <div class="dpad">
        <button data-key="ArrowUp">▲</button>
        <button data-key="ArrowLeft">◀</button>
        <button data-key="ArrowDown">▼</button>
        <button data-key="ArrowRight">▶</button>
      </div>
      <div class="actions">
        <button data-key="z" class="attack">Z<br><small>ATAQUE</small></button>
        <button data-key="x" class="special">X<br><small>ESPECIAL</small></button>
        <button data-key="c" class="teleport">C<br><small>TELEPORT</small></button>
      </div>
    </section>

    <section id="pause" class="overlay hidden">
      <div class="panel"><h2>PAUSADO</h2><button id="resumeBtn">CONTINUAR</button></div>
    </section>

    <section id="result" class="overlay hidden">
      <div class="panel">
        <div id="resultIcon">🏆</div>
        <h2 id="resultTitle">VITÓRIA!</h2>
        <p id="resultText"></p>
        <button id="restartBtn">JOGAR NOVAMENTE</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
